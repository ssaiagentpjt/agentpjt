# 앱 APK 릴리스. app-v* 태그를 push 하면 서명된 release APK 를 만들어 GitHub Release 에 올린다.
# 다운로드 페이지(site/)는 늘 같은 주소로 최신 APK 를 받는다:
#   https://github.com/<owner>/<repo>/releases/latest/download/sonjuya.apk
# Secret: ANDROID_KEYSTORE_B64·ANDROID_KEYSTORE_PASSWORD·ANDROID_KEY_ALIAS·ANDROID_KEY_PASSWORD(서명), SHOP_API_KEY(목업 서버 키).
# 같은 서명 키로 계속 내야 새 버전이 기존 설치 위에 업데이트된다. 키 원본은 저장소 밖에 보관한다.
name: app-release

on:
  push:
    tags: ["app-v*"]

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 릴리스 만들기

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: SDK 플랫폼(compileSdk 36)
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6

      - name: 버전(app-v0.2.0 → 0.2.0)
        id: ver
        run: echo "name=${GITHUB_REF_NAME#app-v}" >> "$GITHUB_OUTPUT"

      - name: 서버 키와 서명 키 준비
        env:
          SHOP_API_KEY: ${{ secrets.SHOP_API_KEY }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          printf 'shop.apiKey=%s\n' "$SHOP_API_KEY" >> local.properties
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: 테스트와 release 빌드
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease -PappVersion=${{ steps.ver.outputs.name }} -PappVersionCode=${{ github.run_number }}

      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk sonjuya.apk
          size=$(du -m sonjuya.apk | cut -f1)
          gh release create "$GITHUB_REF_NAME" sonjuya.apk \
            --title "손주야 ${{ steps.ver.outputs.name }}" \
            --notes "Android APK ${size}MB · 커밋 ${GITHUB_SHA::7}. 첫 실행 때 AI 파일(2.6GB)을 받습니다."
