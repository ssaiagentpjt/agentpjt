name: agentpjt-shop

services:
  shop-api:
    build: .
    image: agentpjt-shop-api:latest
    restart: unless-stopped
    ports:
      # 홈서버에서는 리버스 프록시만 붙도록 127.0.0.1 로 묶는다
      - "127.0.0.1:8000:8000"
    environment:
      SHOP_API_KEY: ${SHOP_API_KEY:?SHOP_API_KEY 를 .env 또는 환경변수로 지정해야 한다}
      SHOP_PUBLIC_BASE_URL: ${SHOP_PUBLIC_BASE_URL:-}
    volumes:
      - shop-db:/srv/var

volumes:
  shop-db:
